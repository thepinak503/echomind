name: Cross-Compile

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  # Note: LTO is configured in Cargo.toml as "thin" to avoid proc-macro issues
  RUSTFLAGS: -C opt-level=3 -C codegen-units=1 -C embed-bitcode=yes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-gnu:
    name: Build Linux GNU ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config

    - name: Install cross-compilation tools (ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        sudo dpkg --add-architecture arm64
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross

    - name: Set cross-compilation environment (ARM64)
      if: matrix.target == 'aarch64-unknown-linux-gnu'
      run: |
        echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
        echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> $GITHUB_ENV
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Strip binary
      run: |
        if [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/echomind || true
        else
          strip target/${{ matrix.target }}/release/echomind
        fi

    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../echomind-linux-${{ matrix.arch }}.tar.gz echomind
        cd ../../..

    - name: Generate checksums
      run: |
        shasum -a 256 echomind-linux-${{ matrix.arch }}.tar.gz > echomind-linux-${{ matrix.arch }}.tar.gz.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: echomind-linux-${{ matrix.arch }}
        path: |
          echomind-linux-${{ matrix.arch }}.tar.gz
          echomind-linux-${{ matrix.arch }}.tar.gz.sha256

  build-linux-musl:
    name: Build Linux MUSL ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64-musl
          - target: aarch64-unknown-linux-musl
            arch: arm64-musl

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install MUSL tools
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Install cross-compilation tools (ARM64 MUSL)
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Set cross-compilation environment (ARM64 MUSL)
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
        echo "CXX_aarch64_unknown_linux_musl=aarch64-linux-gnu-g++" >> $GITHUB_ENV
        echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar" >> $GITHUB_ENV
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Strip binary
      run: |
        if [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/echomind || true
        else
          strip target/${{ matrix.target }}/release/echomind
        fi

    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../echomind-linux-${{ matrix.arch }}.tar.gz echomind
        cd ../../..

    - name: Generate checksums
      run: |
        shasum -a 256 echomind-linux-${{ matrix.arch }}.tar.gz > echomind-linux-${{ matrix.arch }}.tar.gz.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: echomind-linux-${{ matrix.arch }}
        path: |
          echomind-linux-${{ matrix.arch }}.tar.gz
          echomind-linux-${{ matrix.arch }}.tar.gz.sha256

  build-macos:
    name: Build macOS ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            arch: amd64
          - target: aarch64-apple-darwin
            os: macos-14
            arch: arm64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release --target ${{ matrix.target }}

    - name: Strip binary
      run: strip target/${{ matrix.target }}/release/echomind

    - name: Package
      run: |
        cd target/${{ matrix.target }}/release
        tar czf ../../../echomind-macos-${{ matrix.arch }}.tar.gz echomind
        cd ../../..

    - name: Generate checksums
      run: |
        shasum -a 256 echomind-macos-${{ matrix.arch }}.tar.gz > echomind-macos-${{ matrix.arch }}.tar.gz.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: echomind-macos-${{ matrix.arch }}
        path: |
          echomind-macos-${{ matrix.arch }}.tar.gz
          echomind-macos-${{ matrix.arch }}.tar.gz.sha256

  build-windows-msvc:
    name: Build Windows MSVC
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary
      run: |
        cargo build --release

    - name: Package
      run: |
        cd target\release
        Compress-Archive -Path echomind.exe -DestinationPath ..\..\echomind-windows-amd64-msvc.zip
        cd ..\..

    - name: Generate checksums
      run: |
        $hash = (Get-FileHash echomind-windows-amd64-msvc.zip -Algorithm SHA256).Hash.ToLower()
        "$hash  echomind-windows-amd64-msvc.zip" | Out-File -FilePath echomind-windows-amd64-msvc.zip.sha256

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: echomind-windows-amd64-msvc
        path: |
          echomind-windows-amd64-msvc.zip
          echomind-windows-amd64-msvc.zip.sha256

  test-artifacts:
    name: Test Build Artifacts
    needs: [build-linux-gnu, build-linux-musl, build-macos, build-windows-msvc]
    runs-on: ubuntu-latest
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List downloaded artifacts
      run: |
        echo "Downloaded artifacts:"
        find artifacts -type f -exec ls -lh {} \;

    - name: Verify tar.gz files
      run: |
        find artifacts -name "*.tar.gz" -exec tar -tzf {} \; | head -10

    - name: Verify zip files
      run: |
        find artifacts -name "*.zip" -exec unzip -l {} \; | head -10

  release:
    name: Create Release
    needs: [build-linux-gnu, build-linux-musl, build-macos, build-windows-msvc]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Flatten artifacts
      run: |
        find artifacts -type f -exec cp {} . \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          echomind-*.tar.gz
          echomind-*.tar.gz.sha256
          echomind-*.zip
          echomind-*.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
