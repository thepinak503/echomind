name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -C opt-level=3 -C codegen-units=1 -C embed-bitcode=yes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: echomind
            asset: echomind-linux-amd64
            name: Linux x86_64 GNU
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: echomind
            asset: echomind-linux-arm64
            name: Linux ARM64 GNU
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: echomind
            asset: echomind-linux-amd64-musl
            name: Linux x86_64 MUSL
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: echomind
            asset: echomind-linux-arm64-musl
            name: Linux ARM64 MUSL
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: echomind.exe
            asset: echomind-windows-amd64
            name: Windows x86_64 MSVC
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: echomind
            asset: echomind-macos-amd64
            name: macOS x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: echomind
            asset: echomind-macos-arm64
            name: macOS ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config

      - name: Install ARM64 GNU cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install MUSL tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get install -y musl-tools

      - name: Install ARM64 MUSL cross-compilation
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Setup MSVC
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [[ "${{ matrix.target }}" == *"aarch64"* ]]; then
            aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact }} || strip target/${{ matrix.target }}/release/${{ matrix.artifact }}
          else
            strip target/${{ matrix.target }}/release/${{ matrix.artifact }}
          fi

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset }}.tar.gz ${{ matrix.artifact }}
          cd ../../..
          shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target\${{ matrix.target }}\release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ..\..\..\${{ matrix.asset }}.zip
          cd ..\..\..
          $hash = (Get-FileHash ${{ matrix.asset }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}.zip" | Out-File -FilePath ${{ matrix.asset }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            *.sha256
          if-no-files-found: ignore

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
            *.sha256
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx
      - name: Generate SBOM
        run: cargo cyclonedx --all --format json --output-pattern package
      - name: Upload SBOM
        uses: softprops/action-gh-release@v2
        with:
          files: '*.json'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    name: Update Release Notes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate release notes
        run: |
          cat > release_notes.md << 'EOF'
          ## Release ${{ github.ref_name }}

          ### Downloads

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | Linux (GNU) | x86_64 | [echomind-linux-amd64.tar.gz](echomind-linux-amd64.tar.gz) |
          | Linux (GNU) | ARM64 | [echomind-linux-arm64.tar.gz](echomind-linux-arm64.tar.gz) |
          | Linux (MUSL) | x86_64 | [echomind-linux-amd64-musl.tar.gz](echomind-linux-amd64-musl.tar.gz) |
          | Linux (MUSL) | ARM64 | [echomind-linux-arm64-musl.tar.gz](echomind-linux-arm64-musl.tar.gz) |
          | Windows | x86_64 | [echomind-windows-amd64.zip](echomind-windows-amd64.zip) |
          | macOS (Intel) | x86_64 | [echomind-macos-amd64.tar.gz](echomind-macos-amd64.tar.gz) |
          | macOS (Apple Silicon) | ARM64 | [echomind-macos-arm64.tar.gz](echomind-macos-arm64.tar.gz) |

          ### Installation

          #### Linux
          ```bash
          wget https://github.com/thepinak503/echomind/releases/download/${{ github.ref_name }}/echomind-linux-amd64.tar.gz
          tar xzf echomind-linux-amd64.tar.gz
          sudo mv echomind /usr/local/bin/
          ```

          #### macOS
          ```bash
          curl -LO https://github.com/thepinak503/echomind/releases/download/${{ github.ref_name }}/echomind-macos-arm64.tar.gz
          tar xzf echomind-macos-arm64.tar.gz
          sudo mv echomind /usr/local/bin/
          ```

          #### Windows
          ```powershell
          Invoke-WebRequest -Uri "https://github.com/thepinak503/echomind/releases/download/${{ github.ref_name }}/echomind-windows-amd64.zip" -OutFile "echomind.zip"
          Expand-Archive echomind.zip -DestinationPath .
          ```

          ### Verification
          Each download includes SHA256 checksums for verification.

          Full changelog: [CHANGELOG.md](https://github.com/thepinak503/echomind/blob/main/docs/CHANGELOG.md)
          EOF

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
