[package]
name = "echomind"
version = "0.3.2"
edition = "2021"
description = "A powerful, lightweight AI CLI tool that pipes input to multiple AI chat APIs"
authors = ["The Pinak <pinak@echomind.dev>"]
repository = "https://github.com/thepinak503/echomind"
homepage = "https://github.com/thepinak503/echomind"
documentation = "https://github.com/thepinak503/echomind"
keywords = ["ai", "cli", "chat", "llm", "terminal"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
name = "echomind"
path = "src/main.rs"

[lib]
name = "echomind"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "socks"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "net", "time", "process", "io-std"] }
futures = "0.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

clap = { version = "4.0", features = ["derive", "cargo"] }
toml = "0.8"
dirs = "5.0"

thiserror = "1.0"
anyhow = "1.0"

eventsource-stream = "0.2"

colored = "2.1"
indicatif = "0.17"
crossterm = "0.27"
ratatui = "0.26"

rustyline = "14.0"
syntect = "5.2"
termcolor = "1.4"
regex = "1.10"

chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

cpal = { version = "0.15", optional = true }
rodio = { version = "0.19", optional = true }

ring = "0.17"
rand = "0.8"
hex = "0.4"

csv = "1.3"
calamine = "0.24"

pdf = { version = "0.8", optional = true }
image = { version = "0.24", optional = true }

cron = "0.12"

uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"

lru = "0.12"

whatlang = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Console"] }
winapi-util = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
core-foundation = "0.2"
core-graphics = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"

[features]
default = ["voice", "pdf", "images"]
voice = ["dep:cpal", "dep:rodio"]
pdf = ["dep:pdf"]
images = ["dep:image"]
all-features = ["voice", "pdf", "images"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true

[workspace]
