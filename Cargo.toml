[package]
name = "echomind"
version = "0.3.5"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
toml = "0.8"
dirs = "6.0"
thiserror = "1.0"
anyhow = "1.0"
indicatif = "0.17"
colored = "2.1"
rustyline = "14.0"
eventsource-stream = "0.2"
futures = "0.3"
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"

# Voice support (disabled for Windows build issues)
cpal = { version = "0.15", optional = true }
rodio = { version = "0.19", optional = true }

# Security & encryption
ring = "0.17"
rand = "0.8"

# Data processing
csv = "1.3"
calamine = "0.24"
pdf = { version = "0.10", optional = true }
image = { version = "0.24", optional = true }

# Scheduling & automation
cron = "0.12"

# Advanced output
syntect = "5.2"
termcolor = "1.4"

# Web & integrations
uuid = { version = "1.6", features = ["v4", "serde"] }
url = "2.5"

# Performance monitoring
lru = "0.12"

# Accessibility
crossterm = "0.27"
ratatui = "0.26"
textwrap = "0.16"

# AI-powered features
regex = "1.10"
whatlang = "0.16"

# Security
hex = "0.4"

[features]
default = ["pdf", "images"]
all-features = ["pdf", "images", "voice"]
pdf = ["dep:pdf"]
images = ["dep:image"]
voice = ["dep:cpal", "dep:rodio"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.dev]
opt-level = 1
debug = true

[profile.release.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.8"
mockito = "1.2"
